name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '7.1'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
          ini-values: date.timezone=UTC

      - name: Show PHP version
        run: php -v

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run behavioral and packet tests
        run: php tests/run.php

      - name: Check packet bytes against 5.6 fixture
        run: |
          php tests/tools/dump_packets.php > /tmp/packets.dump
          diff -u tests/fixtures/packets.dump /tmp/packets.dump
